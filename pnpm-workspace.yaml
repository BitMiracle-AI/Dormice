# Workspace members: every directory under packages/ is a package; e2e is its
# own package — the black-box suite that boots the built daemon and drives it
# over the wire (the E2B compatibility suite will join it when that layer lands);
# examples holds runnable demos linked against the local build; website is the
# public site (Next.js static export). Neither is ever published to npm
packages:
  - packages/*
  - e2e
  - examples
  - website

# Supply-chain defense: a newly published npm version must be at least 24 hours
# (1440 minutes) old before it can be installed — poisoned releases are usually
# found and unpublished within hours, so waiting a day avoids most incidents
minimumReleaseAge: 1440

# Build-script allowlist: dependencies may not run install scripts by default.
# Approve one by one, each line stating why the script is needed.
onlyBuiltDependencies:
  - esbuild # tsup's underlying bundler; postinstall downloads the platform binary
  - better-sqlite3 # native SQLite module; install script downloads a prebuilt binary (compiles locally if none matches)

# Reviewed server/gateway dependency fixes; keep the 24-hour age gate.
overrides:
  fastify: 5.12.6
  '@fastify/static': 10.1.2
  find-my-way: 9.7.0
  'undici@^8.7.0': 8.12.2
  '@grpc/grpc-js': 1.14.5
  '@fastify/busboy': 3.2.2
  'glob@^13.0.0': 14.0.2
  fast-uri: 3.1.9
  '@esbuild-kit/core-utils>esbuild': 0.28.2
